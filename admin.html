
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee8">
  <title>مدیریت فروشگاه لوتوس</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f2ed;
      --card: #ffffff;
      --ink: #302b29;
      --muted: #827871;
      --accent: #84644c;
      --line: #e9e1d9;
      --danger: #b63b3b;
      --green: #26764b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Tahoma, Arial, sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
    }

    button:disabled { opacity: .55; cursor: wait; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      padding: 12px;
      color: var(--ink);
      outline-color: var(--accent);
    }

    textarea { min-height: 90px; resize: vertical; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    .wrap { max-width: 1100px; margin: auto; padding: 20px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand { font-size: 25px; font-weight: bold; letter-spacing: 2px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 5px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px #38291a08;
    }

    h2 { margin-top: 0; font-size: 19px; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 14px; }
    .wide { grid-column: 1 / -1; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .secondary { background: #eee6df; color: var(--ink); }
    .danger { background: var(--danger); }
    .success { background: var(--green); }
    .status { font-size: 14px; line-height: 1.9; white-space: pre-wrap; }
    .muted { color: var(--muted); font-size: 13px; }
    .preview {
      width: 100%;
      max-width: 180px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f8f5f1;
      margin-top: 10px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .product {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      min-width: 0;
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      background: #f5f0ea;
    }

    .product h3 { margin: 12px 0 7px; font-size: 16px; overflow-wrap: anywhere; }
    .product p { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .price { font-weight: bold; color: var(--accent); margin: 8px 0; }
    .pill { font-size: 12px; padding: 4px 8px; border-radius: 30px; background: #eee6df; display: inline-block; }
    .pill.off { background: #f9e3e3; color: #a12d2d; }
    .empty { text-align: center; padding: 32px 12px; color: var(--muted); }

    @media (max-width: 600px) {
      .wrap { padding: 12px; }
      .card { padding: 15px; }
      .grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      header { align-items: flex-start; }
      .brand { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">LOTUS <span style="color:#84644c">لوتوس</span></div>
        <div class="sub">پنل مدیریت فروشگاه روتختی و لوازم اتاق خواب</div>
      </div>
      <button id="logoutBtn" class="secondary hidden" type="button">خروج از حساب</button>
    </header>

    <div id="status" class="card status" role="status">در حال آماده‌سازی پنل...</div>

    <section id="loginSection" class="card hidden">
      <h2>ورود مدیر</h2>
      <p class="muted">با ایمیل و رمز عبور حساب مدیر Supabase وارد شو.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">ایمیل</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="loginBtn">ورود امن</button>
      </form>
    </section>

    <section id="adminSection" class="hidden">
      <div class="card">
        <h2 id="formTitle">افزودن محصول جدید</h2>

        <form id="productForm">
          <input id="productId" type="hidden">

          <div class="grid">
            <div class="field">
              <label for="name">نام محصول *</label>
              <input id="name" maxlength="200" required placeholder="مثلاً ست روتختی دونفره">
            </div>

            <div class="field">
              <label for="category">دسته‌بندی *</label>
              <input id="category" maxlength="100" required placeholder="مثلاً روتختی">
            </div>

            <div class="field">
              <label for="price">قیمت به تومان *</label>
              <input id="price" type="number" min="0" step="1" required placeholder="مثلاً 2500000">
            </div>

            <div class="field">
              <label for="stock">موجودی *</label>
              <input id="stock" type="number" min="0" step="1" value="0" required>
            </div>

            <div class="field wide">
              <label for="description">توضیحات محصول</label>
              <textarea id="description" maxlength="5000" placeholder="جنس، ابعاد، رنگ و توضیحات محصول"></textarea>
            </div>

            <div class="field wide">
              <label for="image">تصویر محصول</label>
              <input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <div class="muted">حداکثر 5 مگابایت. فرمت‌های JPG، PNG، WebP و GIF.</div>
              <img id="imagePreview" class="preview hidden" alt="پیش‌نمایش عکس محصول">
            </div>

            <div class="field wide">
              <label>
                <input id="active" type="checkbox" checked style="width:auto; margin-left:6px">
                محصول در فروشگاه نمایش داده شود
              </label>
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="saveBtn">ذخیره محصول</button>
            <button type="button" id="cancelEditBtn" class="secondary hidden">لغو ویرایش</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <h2 style="margin-bottom:0">محصولات فروشگاه</h2>
          <button type="button" id="refreshBtn" class="secondary">به‌روزرسانی فهرست</button>
        </div>
        <p id="productCount" class="muted"></p>
        <div id="products" class="products"></div>
      </div>
    </section>
  </div>

  <script>
    // Public browser key only. Never put a service_role or secret key here.
    const SUPABASE_URL = "https://lmkeqrflggxovjqnupll.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DQCI-4BHUWcRSQjphryqKQ_aHu35b76";
    const BUCKET = "lotus-products";

    const $ = (id) => document.getElementById(id);
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentImageUrl = "";
    let currentImagePath = "";
    let busy = false;

    function setStatus(message, isError = false) {
      $("status").textContent = message;
      $("status").style.color = isError ? "#b63b3b" : "";
      $("status").classList.remove("hidden");
    }

    function showLogin() {
      $("loginSection").classList.remove("hidden");
      $("adminSection").classList.add("hidden");
      $("logoutBtn").classList.add("hidden");
    }

    function showAdmin() {
      $("loginSection").classList.add("hidden");
      $("adminSection").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
    }

    function formatPrice(value) {
      return Number(value || 0).toLocaleString("fa-IR") + " تومان";
    }

    function safeImageUrl(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" ? parsed.href : "";
      } catch {
        return "";
      }
    }

    async function checkAdmin() {
      const { data: { user }, error: sessionError } = await client.auth.getUser();

      if (sessionError || !user) {
        showLogin();
        setStatus("برای مدیریت محصولات، ابتدا وارد حساب مدیر شو.");
        return false;
      }

      const { data, error } = await client
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        showLogin();
        setStatus("بررسی دسترسی مدیر ناموفق بود. سیاست RLS جدول admin_users را بررسی کن. جزئیات: " + error.message, true);
        return false;
      }

      if (!data) {
        await client.auth.signOut();
        showLogin();
        setStatus("این حساب دسترسی مدیر ندارد. UUID حساب را در جدول admin_users ثبت کن.", true);
        return false;
      }

      showAdmin();
      setStatus("ورود موفق بود. می‌توانی محصولات فروشگاه لوتوس را مدیریت کنی.");
      await loadProducts();
      return true;
    }

    $("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      busy = true;
      $("loginBtn").disabled = true;
      setStatus("در حال بررسی اطلاعات ورود...");

      try {
        const { error } = await client.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) throw error;
        await checkAdmin();
      } catch (error) {
        setStatus("ورود ناموفق بود: " + error.message, true);
      } finally {
        busy = false;
        $("loginBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      showLogin();
      setStatus("از حساب مدیریت خارج شدی.");
    });

    $("image").addEventListener("change", () => {
      const file = $("image").files[0];
      if (!file) return;

      const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
      if (!allowed.includes(file.type) || file.size > 5 * 1024 * 1024) {
        $("image").value = "";
        $("imagePreview").classList.add("hidden");
        setStatus("عکس باید JPG، PNG، WebP یا GIF و حداکثر ۵ مگابایت باشد.", true);
        return;
      }

      $("imagePreview").src = URL.createObjectURL(file);
      $("imagePreview").classList.remove("hidden");
    });

    async function uploadImage(file) {
      const extensionMap = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };
      const ext = extensionMap[file.type];
      const path = "products/" + crypto.randomUUID() + "." + ext;

      const { error } = await client.storage
        .from(BUCKET)
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (error) throw error;

      const { data } = client.storage.from(BUCKET).getPublicUrl(path);
      return { url: data.publicUrl, path };
    }

    function resetForm() {
      $("productForm").reset();
      $("productId").value = "";
      $("stock").value = "0";
      $("active").checked = true;
      $("formTitle").textContent = "افزودن محصول جدید";
      $("saveBtn").textContent = "ذخیره محصول";
      $("cancelEditBtn").classList.add("hidden");
      $("imagePreview").classList.add("hidden");
      $("imagePreview").removeAttribute("src");
      $("image").value = "";
      currentImageUrl = "";
      currentImagePath = "";
    }

    $("cancelEditBtn").addEventListener("click", resetForm);

    $("productForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      const id = $("productId").value;
      const name = $("name").value.trim();
      const category = $("category").value.trim();
      const price = Number($("price").value);
      const stock = Number($("stock").value);
      const file = $("image").files[0];

      if (!name || !category || !Number.isFinite(price) || price < 0 ||
          !Number.isInteger(stock) || stock < 0) {
        setStatus("نام، دسته‌بندی، قیمت و موجودی را درست وارد کن.", true);
        return;
      }

      busy = true;
      $("saveBtn").disabled = true;
      setStatus("در حال ذخیره محصول...");

      try {
        let imageUrl = currentImageUrl;

        if (file) {
          const uploaded = await uploadImage(file);
          imageUrl = uploaded.url;
        }

        const product = {
          name,
          description: $("description").value.trim(),
          price,
          image_url: imageUrl || "",
          category,
          stock,
          active: $("active").checked,
          updated_at: new Date().toISOString()
        };

        let result;
        if (id) {
          result = await client
            .from("products")
            .update(product)
            .eq("id", id)
            .select("id")
            .single();
        } else {
          result = await client
            .from("products")
            .insert(product)
            .select("id")
            .single();
        }

        if (result.error) throw result.error;

        setStatus(id ? "محصول با موفقیت ویرایش شد." : "محصول جدید با موفقیت اضافه شد.");
        resetForm();
        await loadProducts();
      } catch (error) {
        setStatus("ذخیره محصول ناموفق بود: " + error.message, true);
      } finally {
        busy = false;
        $("saveBtn").disabled = false;
      }
    });

    function makeProductCard(product) {
      const card = document.createElement("article");
      card.className = "product";

      const img = document.createElement("img");
      img.alt = product.name || "تصویر محصول";
      img.loading = "lazy";
      img.src = safeImageUrl(product.image_url) ||
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#f5f0ea"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#827871" font-size="20">LOTUS</text></svg>');
      card.appendChild(img);

      const title = document.createElement("h3");
      title.textContent = product.name || "بدون نام";
      card.appendChild(title);

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = formatPrice(product.price);
      card.appendChild(price);

      const details = document.createElement("p");
      details.textContent =
        "دسته‌بندی: " + (product.category || "بدون دسته‌بندی") +
        "\nموجودی: " + Number(product.stock || 0).toLocaleString("fa-IR");
      card.appendChild(details);

      const pill = document.createElement("span");
      pill.className = "pill" + (product.active ? "" : " off");
      pill.textContent = product.active ? "فعال" : "غیرفعال";
      card.appendChild(pill);

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.style.marginTop = "12px";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "secondary";
      edit.textContent = "ویرایش";
      edit.addEventListener("click", () => {
        $("productId").value = product.id;
        $("name").value = product.name || "";
        $("description").value = product.description || "";
        $("price").value = product.price ?? 0;
        $("category").value = product.category || "";
        $("stock").value = product.stock ?? 0;
        $("active").checked = Boolean(product.active);
        $("formTitle").textContent = "ویرایش محصول";
        $("saveBtn").textContent = "ذخیره تغییرات";
        $("cancelEditBtn").classList.remove("hidden");
        currentImageUrl = product.image_url || "";
        currentImagePath = "";
        $("image").value = "";

        if (safeImageUrl(currentImageUrl)) {
          $("imagePreview").src = currentImageUrl;
          $("imagePreview").classList.remove("hidden");
        } else {
          $("imagePreview").classList.add("hidden");
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      actions.appendChild(edit);

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "secondary";
      toggle.textContent = product.active ? "غیرفعال‌کردن" : "فعال‌کردن";
      toggle.addEventListener("click", async () => {
        const { error } = await client.from("products")
          .update({ active: !product.active, updated_at: new Date().toISOString() })
          .eq("id", product.id);
        if (error) setStatus("تغییر وضعیت ناموفق بود: " + error.message, true);
        else {
          setStatus("وضعیت محصول تغییر کرد.");
          await loadProducts();
        }
      });
      actions.appendChild(toggle);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "حذف";
      del.addEventListener("click", async () => {
        if (!confirm("محصول «" + product.name + "» حذف شود؟ این کار برگشت‌پذیر نیست.")) return;
        const { error } = await client.from("products").delete().eq("id", product.id);
        if (error) setStatus("حذف ناموفق بود: " + error.message, true);
        else {
          setStatus("محصول حذف شد.");
          if ($("productId").value === product.id) resetForm();
          await loadProducts();
        }
      });
      actions.appendChild(del);

      card.appendChild(actions);
      return card;
    }

    async function loadProducts() {
      $("products").replaceChildren();
      $("productCount").textContent = "در حال بارگذاری...";

      const { data, error } = await client
        .from("products")
        .select("id,name,description,price,image_url,category,stock,active,created_at")
        .order("created_at", { ascending: false });

      if (error) {
        $("productCount").textContent = "";
        setStatus("خواندن محصولات ناموفق بود: " + error.message, true);
        return;
      }

      $("productCount").textContent =
        "تعداد محصولات: " + data.length.toLocaleString("fa-IR");

      if (!data.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "هنوز محصولی اضافه نکرده‌ای. از فرم بالا اولین محصول را ثبت کن.";
        $("products").appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      data.forEach((product) => fragment.appendChild(makeProductCard(product)));
      $("products").appendChild(fragment);
    }

    $("refreshBtn").addEventListener("click", loadProducts);

    (async function init() {
      if (!window.supabase || !SUPABASE_URL || !SUPABASE_KEY) {
        setStatus("اتصال Supabase آماده نیست. آدرس و کلید عمومی را بررسی کن.", true);
        return;
      }
      await checkAdmin();
    })();
  </script>
</body>
</html>
