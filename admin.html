<script>

(() => {

"use strict";


const SUPABASE_URL =
"https://lmkeqrflggxovjqnupll.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DQCI-4BHUWcRSQjphryqKQ_aHu35b76";

const BUCKET =
"lotus-products";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const $ = id =>
document.getElementById(id);


let allProducts = [];
let allOrders = [];
let busy = false;


function message(text,error=false){

$("notice").textContent = text;

$("notice").style.background =
error ? "#fff0f1" : "#eef3ff";

$("notice").style.color =
error ? "#a51f37" : "#25324a";

}


function friendlyError(error){

return error?.message ||
String(error || "خطای ناشناخته");

}


function setBusy(value){

busy=value;

$("saveBtn").disabled=value;

$("loginBtn").disabled=value;

}


/* ADMIN */

async function isAdmin(user){

const {data,error}=await client

.from("admin_users")

.select("user_id")

.eq("user_id",user.id)

.maybeSingle();


if(error) throw error;

return !!data;

}


async function showSession(){

const {data,error}=
await client.auth.getSession();

if(error) throw error;


const session=data.session;


if(!session){

$("loginCard").classList.remove("hidden");

$("dashboard").classList.add("hidden");

return;

}


const allowed=
await isAdmin(session.user);


if(!allowed){

await client.auth.signOut();

throw new Error(
"این حساب مدیر نیست."
);

}


$("loginCard").classList.add("hidden");

$("dashboard").classList.remove("hidden");


await loadProducts();

await loadOrders();

}


/* LOGIN */

$("loginForm").addEventListener(
"submit",
async event=>{

event.preventDefault();

if(busy)return;

setBusy(true);


try{

const {error}=
await client.auth.signInWithPassword({

email:$("email").value.trim(),

password:$("password").value

});


if(error)throw error;


await showSession();

message(
"با موفقیت وارد پنل مدیریت شدی."
);


}catch(error){

message(
"ورود ناموفق: "+
friendlyError(error),
true
);

}finally{

setBusy(false);

}

});


/* LOGOUT */

$("logoutBtn").addEventListener(
"click",
async()=>{

await client.auth.signOut();

$("loginCard")
.classList.remove("hidden");

$("dashboard")
.classList.add("hidden");

message("از حساب خارج شدی.");

});


/* PRODUCT FORM */

function resetForm(){

$("productForm").reset();

$("productId").value="";

$("active").checked=true;

$("stock").value="0";

$("formTitle").textContent=
"➕ افزودن محصول جدید";

$("saveBtn").textContent=
"ذخیره محصول";

}


$("resetBtn").addEventListener(
"click",
resetForm
);


/* IMAGE */

async function uploadImage(file){

if(!file)return null;


const allowed=[
"image/jpeg",
"image/png",
"image/webp"
];


if(!allowed.includes(file.type)){

throw new Error(
"فرمت تصویر باید JPG، PNG یا WebP باشد."
);

}


if(file.size > 5*1024*1024){

throw new Error(
"حجم تصویر باید کمتر از ۵ مگابایت باشد."
);

}


const ext =
file.type==="image/jpeg"
? "jpg"
: file.type==="image/png"
? "png"
: "webp";


const path =
"products/"
+crypto.randomUUID()
+"."+ext;


const {error}=
await client.storage
.from(BUCKET)
.upload(
path,
file,
{
contentType:file.type,
upsert:false
}
);


if(error)throw error;


const {data}=
client.storage
.from(BUCKET)
.getPublicUrl(path);


return data.publicUrl;

}


/* SAVE PRODUCT */

$("productForm").addEventListener(
"submit",
async event=>{

event.preventDefault();

if(busy)return;

setBusy(true);


try{

const id=$("productId").value;

const payload={

name:$("name").value.trim(),

description:
$("description").value.trim(),

price:Number($("price").value),

category:$("category").value,

stock:Number($("stock").value),

active:$("active").checked,

updated_at:
new Date().toISOString()

};


const file=$("image").files[0];


if(file){

payload.image_url=
await uploadImage(file);

}


let result;


if(id){

result=
await client
.from("products")
.update(payload)
.eq("id",id);

}else{

result=
await client
.from("products")
.insert(payload);

}


if(result.error)
throw result.error;


resetForm();

message(
id
? "محصول ویرایش شد."
: "محصول جدید اضافه شد."
);


await loadProducts();


}catch(error){

message(
"ذخیره محصول انجام نشد: "+
friendlyError(error),
true
);

}finally{

setBusy(false);

}

});


/* LOAD PRODUCTS */

async function loadProducts(){

$("products").textContent=
"در حال دریافت محصولات...";


const {data,error}=
await client

.from("products")

.select(
"id,name,description,price,image_url,category,stock,active,created_at"
)

.order(
"created_at",
{ascending:false}
);


if(error)throw error;


allProducts=data||[];

renderProducts();

}


/* RENDER PRODUCTS */

function renderProducts(){

const term=
$("search")
.value
.trim()
.toLocaleLowerCase("fa");


const filtered=
allProducts.filter(product=>

String(product.name||"")
.toLocaleLowerCase("fa")
.includes(term)

);


$("productCount").textContent=
"تعداد محصولات: "+
filtered.length+
" | مجموع: "+
allProducts.length;


const container=$("products");

container.replaceChildren();


if(!filtered.length){

container.textContent=
"محصولی پیدا نشد.";

return;

}


filtered.forEach(product=>{

const card=
document.createElement("article");

card.className="product";


if(product.image_url){

const img=
document.createElement("img");

img.src=product.image_url;

img.alt=product.name||"محصول";

img.loading="lazy";

card.append(img);

}


const title=
document.createElement("h3");

title.textContent=
product.name||"بدون نام";

card.append(title);


const price=
document.createElement("p");

price.className="price";

price.textContent=
Number(product.price||0)
.toLocaleString("fa-IR")
+" تومان";

card.append(price);


const info=
document.createElement("p");

info.className="muted";

info.textContent=
"دسته: "+
(product.category||"عمومی")+
" | موجودی: "+
Number(product.stock||0)+
" | وضعیت: "+
(product.active?"فعال":"غیرفعال");

card.append(info);


const actions=
document.createElement("div");

actions.className="actions";


const edit=
document.createElement("button");

edit.type="button";

edit.className="secondary";

edit.textContent="ویرایش";


edit.onclick=()=>{

$("productId").value=
product.id;

$("name").value=
product.name||"";

$("description").value=
product.description||"";

$("price").value=
product.price??0;

$("category").value=
product.category||"عمومی";

$("stock").value=
product.stock??0;

$("active").checked=
!!product.active;

$("image").value="";

$("formTitle").textContent=
"✏️ ویرایش محصول";

$("saveBtn").textContent=
"ثبت تغییرات";


$("productForm")
.scrollIntoView({
behavior:"smooth"
});

};


actions.append(edit);


const toggle=
document.createElement("button");

toggle.type="button";

toggle.className="secondary";

toggle.textContent=
product.active
? "غیرفعال کردن"
: "فعال کردن";


toggle.onclick=
async()=>{

const {error}=
await client

.from("products")

.update({
active:!product.active,
updated_at:
new Date().toISOString()
})

.eq("id",product.id);


if(error){

message(
friendlyError(error),
true
);

}else{

await loadProducts();

message(
"وضعیت محصول تغییر کرد."
);

}

};


actions.append(toggle);


const remove=
document.createElement("button");

remove.type="button";

remove.className="danger";

remove.textContent="حذف";


remove.onclick=
async()=>{

if(
!confirm(
"این محصول حذف شود؟"
)
)return;


const {error}=
await client

.from("products")

.delete()

.eq("id",product.id);


if(error){

message(
friendlyError(error),
true
);

}else{

await loadProducts();

message(
"محصول حذف شد."
);

}

};


actions.append(remove);

card.append(actions);

container.append(card);

});

}


/* SEARCH */

$("search").addEventListener(
"input",
renderProducts
);


/* REFRESH PRODUCTS */

$("refreshBtn").addEventListener(

async()=>{

try{

await loadProducts();

message(
"محصولات به‌روزرسانی شدند."
);

}catch(error){

message(
friendlyError(error),
true
);

}

});


/* ========================= */
/* ORDERS */
/* ========================= */


const statusNames={

pending:"در انتظار بررسی",

accepted:"تأیید شده",

in_progress:"در حال آماده‌سازی",

delivered:"تحویل داده شده",

completed:"تکمیل شده",

cancelled:"لغو شده",

disputed:"اختلاف / مشکل"

};


function statusText(status){

return statusNames[status]
||status
||"در انتظار بررسی";

}


function formatDate(date){

if(!date)return "-";

return new Date(date)
.toLocaleString(
"fa-IR",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


function formatMoney(value){

return Number(value||0)
.toLocaleString("fa-IR")
+" تومان";

}


/* ORDER ITEMS */

function renderOrderItems(items){

if(!items){

return "اطلاعات محصولات موجود نیست.";

}


if(typeof items==="string"){

try{

items=JSON.parse(items);

}catch{

return items;

}

}


if(!Array.isArray(items)){

if(typeof items==="object"){

return Object.entries(items)
.map(
([key,value])=>
`${key}: ${value}`
)
.join("<br>");

}

return String(items);

}


if(!items.length){

return "محصولی ثبت نشده.";

}


return items.map(item=>{

const name=
item.name ||
item.title ||
item.product_name ||
"محصول";


const qty=
item.quantity ??
item.qty ??
item.count ??
1;


const price=
item.price ??
item.unit_price;


let line=
name+
" × "+
qty;


if(price!==undefined){

line+=
" — "+
formatMoney(price);

}


return line;

}).join("<br>");

}

document.createElement("span");

customerText.textContent=

document.createElement("div");

phone.innerHTML=

document.createElement("span");

phoneText.textContent=

phone.append(phoneText);

const address=
document.createElement("div");

address.innerHTML=
"<strong>آدرس:</strong> ";

const addressText=
document.createElement("span");

addressText.textContent=
order.customer_address||"-";

address.append(addressText);

info.append(address);


const date=
document.createElement("div");

date.innerHTML=
"<strong>تاریخ:</strong> "+
formatDate(order.created_at);

info.append(date);


card.append(info);


/* ITEMS */

const itemsBox=
document.createElement("div");

itemsBox.className="order-items";

const itemsTitle=
document.createElement("strong");

itemsTitle.textContent=
"🛍 محصولات سفارش:";

itemsBox.append(itemsTitle);

const itemsContent=

itemsContent.style.marginTop="5px";

itemsContent.innerHTML=
renderOrderItems(order.items);

itemsBox.append(itemsContent);

card.append(itemsBox);


/* NOTE */

if(order.note){

const note=
document.createElement("p");

note.className="muted";

note.textContent=
"یادداشت مشتری: "+
order.note;

card.append(note);

const total=
document.createElement("div");

total.className="order-total";

total.textContent=
"مبلغ کل: "+
formatMoney(order.total);

total.style.marginTop="12px";
