
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7ff">
  <title>پنل مدیریت لوتوس</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f2f5fb;color:#25324a}
    header{background:linear-gradient(135deg,#263c70,#6689d9);color:white;padding:24px 16px}
    header h1{margin:0 0 8px;font-size:25px}
    header p{margin:0;color:#e2eaff;font-size:13px}
    main{max-width:1000px;margin:20px auto;padding:0 12px}
    .card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 22px #1e376510}
    h2{font-size:18px;margin:0 0 16px}
    label{display:block;font-size:13px;margin:12px 0 6px}
    input,textarea,select{width:100%;padding:12px;border:1px solid #dce3ef;border-radius:10px;font:inherit;background:white}
    textarea{min-height:90px;resize:vertical}
    button{border:0;border-radius:10px;padding:12px 16px;background:#4169c9;color:white;font:inherit;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .secondary{background:#e9eef9;color:#2e467d}
    .danger{background:#b72c45}
    .success{background:#18875b}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .hidden{display:none!important}
    .status{padding:12px;border-radius:10px;background:#eef3ff;margin:12px 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
    .product{border:1px solid #e4e9f3;border-radius:13px;padding:12px;min-width:0}
    .product img{width:100%;height:170px;object-fit:cover;border-radius:9px;background:#f0f3f8}
    .product h3{font-size:16px;margin:10px 0}
    .muted{color:#7b879d;font-size:12px;line-height:1.8}
    .price{font-weight:bold;color:#3157ac}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    @media(max-width:560px){.row{grid-template-columns:1fr}header h1{font-size:22px}.card{padding:14px}}
  </style>
</head>
<body>
<header>
  <h1>🌸 لوتوس | پنل مدیریت</h1>
  <p>مدیریت محصولات و موجودی فروشگاه</p>
</header>

<main>
  <div id="notice" class="status">برای شروع، با حساب مدیر وارد شوید.</div>

  <section id="loginCard" class="card">
    <h2>ورود مدیر</h2>
    <form id="loginForm">
      <label for="email">ایمیل مدیر</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">رمز عبور</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions">
        <button id="loginBtn" type="submit">ورود به پنل</button>
      </div>
    </form>
  </section>

  <div id="dashboard" class="hidden">
    <section class="card">
      <div class="topline">
        <h2 id="formTitle">افزودن محصول جدید</h2>
        <button id="logoutBtn" class="secondary" type="button">خروج</button>
      </div>
      <form id="productForm">
        <input id="productId" type="hidden">
        <label for="name">نام محصول *</label>
        <input id="name" maxlength="160" required placeholder="مثلاً روتختی دونفره">
        <label for="description">توضیحات</label>
        <textarea id="description" placeholder="جنس، ابعاد و توضیحات محصول"></textarea>
        <div class="row">
          <div>
            <label for="price">قیمت به تومان *</label>
            <input id="price" type="number" min="0" step="1" required>
          </div>
          <div>
            <label for="stock">تعداد موجودی *</label>
            <input id="stock" type="number" min="0" step="1" value="0" required>
          </div>
        </div>
        <label for="category">دسته‌بندی</label>
        <select id="category">
          <option>روتختی</option>
          <option>ملحفه</option>
          <option>بالش</option>
          <option>لحاف و پتو</option>
          <option>پرده</option>
          <option>دکور اتاق خواب</option>
          <option>سرویس خواب</option>
          <option>عمومی</option>
        </select>
        <label for="image">تصویر محصول (JPG، PNG یا WebP)</label>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
        <p class="muted">حداکثر حجم تصویر ۵ مگابایت است. برای تغییر تصویر، فایل جدید انتخاب کن.</p>
        <label><input id="active" type="checkbox" checked style="width:auto"> نمایش محصول در فروشگاه</label>
        <div class="actions">
          <button id="saveBtn" type="submit">ذخیره محصول</button>
          <button id="resetBtn" type="button" class="secondary">فرم جدید</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="topline">
        <h2>محصولات فروشگاه</h2>
        <button id="refreshBtn" type="button" class="secondary">به‌روزرسانی</button>
      </div>
      <label for="search">جست‌وجوی محصولات</label>
      <input id="search" placeholder="نام محصول را وارد کن...">
      <p id="productCount" class="muted"></p>
      <div id="products" class="products"></div>
    </section>
  </div>
</main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://lmkeqrflggxovjqnupll.supabase.co";
  const SUPABASE_KEY = "sb_publishable_DQCI-4BHUWcRSQjphryqKQ_aHu35b76";
  const BUCKET = "lotus-products";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  let allProducts = [];
  let busy = false;

  function message(text, error = false) {
    $("notice").textContent = text;
    $("notice").style.background = error ? "#fff0f1" : "#eef3ff";
    $("notice").style.color = error ? "#a51f37" : "#25324a";
  }

  function friendlyError(error) {
    const text = error?.message || String(error || "خطای ناشناخته");
    if (/row-level security|permission denied|not allowed/i.test(text)) {
      return "دسترسی مجاز نیست. عضویت حساب در admin_users و سیاست‌های RLS را بررسی کن.";
    }
    if (/bucket|storage/i.test(text)) {
      return "خطای فضای تصاویر. وجود bucket با نام lotus-products و سیاست‌های Storage را بررسی کن. جزئیات: " + text;
    }
    return text;
  }

  function setBusy(value) {
    busy = value;
    $("saveBtn").disabled = value;
    $("loginBtn").disabled = value;
  }

  async function isAdmin(user) {
    const { data, error } = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) throw error;
    return !!data;
  }

  async function showSession() {
    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    const session = data.session;
    if (!session) {
      $("loginCard").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      return;
    }

    let allowed;
    try {
      allowed = await isAdmin(session.user);
    } catch (error) {
      await client.auth.signOut();
      throw error;
    }

    if (!allowed) {
      await client.auth.signOut();
      $("loginCard").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      throw new Error("این حساب مدیر نیست. ابتدا شناسه کاربر را در public.admin_users ثبت کن.");
    }

    $("loginCard").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    await loadProducts();
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    setBusy(true);
    try {
      const { error } = await client.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      if (error) throw error;
      await showSession();
      message("با موفقیت وارد پنل مدیریت شدی.");
    } catch (error) {
      message("ورود ناموفق بود: " + friendlyError(error), true);
    } finally {
      setBusy(false);
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await client.auth.signOut();
    if (error) message(friendlyError(error), true);
    else {
      $("loginCard").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      message("از حساب خارج شدی.");
    }
  });

  function resetForm() {
    $("productForm").reset();
    $("productId").value = "";
    $("active").checked = true;
    $("stock").value = "0";
    $("formTitle").textContent = "افزودن محصول جدید";
    $("saveBtn").textContent = "ذخیره محصول";
  }

  $("resetBtn").addEventListener("click", resetForm);

  async function uploadImage(file) {
    if (!file) return null;
    const allowed = ["image/jpeg", "image/png", "image/webp"];
    if (!allowed.includes(file.type)) {
      throw new Error("فرمت تصویر باید JPG، PNG یا WebP باشد.");
    }
    if (file.size > 5 * 1024 * 1024) {
      throw new Error("حجم تصویر باید کمتر از ۵ مگابایت باشد.");
    }

    const ext = file.type === "image/jpeg" ? "jpg" :
                file.type === "image/png" ? "png" : "webp";
    const path = "products/" + crypto.randomUUID() + "." + ext;
    const { error } = await client.storage.from(BUCKET).upload(path, file, {
      contentType: file.type,
      upsert: false
    });
    if (error) throw error;

    const { data } = client.storage.from(BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    setBusy(true);
    try {
      const id = $("productId").value;
      const name = $("name").value.trim();
      const price = Number($("price").value);
      const stock = Number($("stock").value);

      if (!name) throw new Error("نام محصول را وارد کن.");
      if (!Number.isFinite(price) || price < 0) throw new Error("قیمت معتبر نیست.");
      if (!Number.isInteger(stock) || stock < 0) throw new Error("موجودی باید عدد صحیح و نامنفی باشد.");

      const payload = {
        name,
        description: $("description").value.trim(),
        price,
        category: $("category").value,
        stock,
        active: $("active").checked,
        updated_at: new Date().toISOString()
      };

      const file = $("image").files[0];
      if (file) payload.image_url = await uploadImage(file);

      let result;
      if (id) {
        result = await client.from("products").update(payload).eq("id", id);
      } else {
        result = await client.from("products").insert(payload);
      }
      if (result.error) throw result.error;

      resetForm();
      message(id ? "محصول با موفقیت ویرایش شد." : "محصول با موفقیت اضافه شد.");
      await loadProducts();
    } catch (error) {
      message("ذخیره محصول انجام نشد: " + friendlyError(error), true);
    } finally {
      setBusy(false);
    }
  });

  async function loadProducts() {
    $("products").textContent = "در حال دریافت محصولات...";
    const { data, error } = await client
      .from("products")
      .select("id,name,description,price,image_url,category,stock,active,created_at")
      .order("created_at", { ascending: false });

    if (error) {
      $("products").textContent = "";
      throw error;
    }
    allProducts = data || [];
    renderProducts();
  }

  function renderProducts() {
    const term = $("search").value.trim().toLocaleLowerCase("fa");
    const filtered = allProducts.filter(p =>
      String(p.name || "").toLocaleLowerCase("fa").includes(term)
    );

    $("productCount").textContent =
      "تعداد محصولات: " + filtered.length + " (مجموع " + allProducts.length + ")";

    const container = $("products");
    container.replaceChildren();

    if (!filtered.length) {
      container.textContent = "محصولی پیدا نشد.";
      return;
    }

    filtered.forEach(product => {
      const card = document.createElement("article");
      card.className = "product";

      if (product.image_url) {
        const img = document.createElement("img");
        img.src = product.image_url;
        img.alt = product.name || "تصویر محصول";
        img.loading = "lazy";
        card.append(img);
      }

      const title = document.createElement("h3");
      title.textContent = product.name || "بدون نام";
      card.append(title);

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = Number(product.price || 0).toLocaleString("fa-IR") + " تومان";
      card.append(price);

      const info = document.createElement("p");
      info.className = "muted";
      info.textContent = "دسته: " + (product.category || "عمومی") +
        " | موجودی: " + Number(product.stock || 0) +
        " | وضعیت: " + (product.active ? "فعال" : "غیرفعال");
      card.append(info);

      const actions = document.createElement("div");
      actions.className = "actions";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "secondary";
      edit.textContent = "ویرایش";
      edit.addEventListener("click", () => {
        $("productId").value = product.id;
        $("name").value = product.name || "";
        $("description").value = product.description || "";
        $("price").value = product.price ?? 0;
        $("category").value = product.category || "عمومی";
        $("stock").value = product.stock ?? 0;
        $("active").checked = !!product.active;
        $("image").value = "";
        $("formTitle").textContent = "ویرایش محصول";
        $("saveBtn").textContent = "ثبت تغییرات";
        $("productForm").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      actions.append(edit);

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "secondary";
      toggle.textContent = product.active ? "غیرفعال کردن" : "فعال کردن";
      toggle.addEventListener("click", async () => {
        if (!confirm("وضعیت نمایش این محصول تغییر کند؟")) return;
        const { error } = await client.from("products")
          .update({ active: !product.active, updated_at: new Date().toISOString() })
          .eq("id", product.id);
        if (error) message(friendlyError(error), true);
        else {
          message("وضعیت محصول تغییر کرد.");
          await loadProducts();
        }
      });
      actions.append(toggle);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger";
      remove.textContent = "حذف";
      remove.addEventListener("click", async () => {
        if (!confirm("محصول «" + product.name + "» برای همیشه حذف شود؟")) return;
        const { error } = await client.from("products").delete().eq("id", product.id);
        if (error) message("حذف انجام نشد: " + friendlyError(error), true);
        else {
          message("محصول حذف شد.");
          await loadProducts();
        }
      });
      actions.append(remove);
      card.append(actions);
      container.append(card);
    });
  }

  $("refreshBtn").addEventListener("click", async () => {
    try {
      await loadProducts();
      message("فهرست محصولات به‌روزرسانی شد.");
    } catch (error) {
      message(friendlyError(error), true);
    }
  });

  $("search").addEventListener("input", renderProducts);

  client.auth.onAuthStateChange(() => {
    setTimeout(() => {
      showSession().catch(error => message(friendlyError(error), true));
    }, 0);
  });

  showSession().catch(error => message(friendlyError(error), true));
})();
</script>
</body>
</html>
